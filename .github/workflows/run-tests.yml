name: run-tests

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.3, 8.4]
        laravel: [12.*]
        stability: [prefer-stable]

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}
    services:
      db:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_PASSWORD: wm_package
          POSTGRES_DB: wm_package
          POSTGRES_USER: wm_package
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Add hosts to /etc/hosts
        run: sudo echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      # `composer update` lancia `npm install` (post-update-cmd), e `chartjs-node-canvas` tira
      # dentro `canvas`, che per Node 24 non ha un binario precompilato: ripiega sulla
      # compilazione, che senza queste librerie muore con «Package 'pixman-1' not found».
      - name: Librerie di sistema per compilare canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install dependencies
        run: |
          composer config "http-basic.nova.laravel.com" "${{ secrets.NOVA_USERNAME }}" "${{ secrets.NOVA_PASSWORD }}"
          # Nova e' fissata: la licenza e' scaduta e dalla 5.8.0 le release rispondono 402.
          composer require "laravel/framework:${{ matrix.laravel }}" "laravel/nova:5.7.6" --no-interaction
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel.log
          path: vendor/orchestra/testbench-core/laravel/storage/logs/laravel.log
